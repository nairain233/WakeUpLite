name: Android Release

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的已有 tag 名称，例如 v1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布签名 APK
    if: github.event_name == 'workflow_dispatch' || github.event.created == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: 检出完整提交历史与 tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 校验并切换到指定 tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_dispatch' && -z "$INPUT_TAG" ]]; then
            echo '::error::手动发布必须填写 tag 名称。'
            exit 1
          fi
          if ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo '::error::tag 名称不合法。'
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo '::error::指定的 tag 不存在，请先将 tag 推送到仓库。'
            exit 1
          fi
          target_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          git checkout --detach "$target_commit"

      - name: 检查签名 Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::缺少签名 Secrets：${missing[*]}，无法发布 Release APK。"
            exit 1
          fi

      - name: 配置 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: 构建 Release APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: 签名并验证 Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keystore_path="$(mktemp "$RUNNER_TEMP/WakeUpLite-signing-XXXXXX")"
          trap 'rm -f -- "$keystore_path"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"

          mkdir -p "$RUNNER_TEMP/release"
          signed_apk="$RUNNER_TEMP/release/WakeUpLite-release.apk"
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$apksigner" sign \
            --ks "$keystore_path" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$signed_apk" \
            'app/build/outputs/apk/release/app-release-unsigned.apk'
          "$apksigner" verify "$signed_apk"

      - name: 从 commit 主标题生成发布日志
        run: |
          set -euo pipefail
          # 从父提交查找上一个可达 tag，排除当前提交上的 tag。
          previous_tag="$(git describe --tags --abbrev=0 'HEAD^' 2>/dev/null || true)"
          revision_range='HEAD'
          if [[ -n "$previous_tag" ]]; then
            revision_range="refs/tags/$previous_tag..HEAD"
          fi
          git log --reverse --format='- %s' "$revision_range" -- > "$RUNNER_TEMP/release-notes.md"

      - name: 发布到 GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          signed_apk="$RUNNER_TEMP/release/WakeUpLite-release.apk"
          notes_file="$RUNNER_TEMP/release-notes.md"
          if gh release view -- "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload --clobber -- "$RELEASE_TAG" "$signed_apk"
            gh release edit --title "$RELEASE_TAG" --notes-file "$notes_file" -- "$RELEASE_TAG"
          else
            gh release create --verify-tag --title "$RELEASE_TAG" \
              --notes-file "$notes_file" -- "$RELEASE_TAG" "$signed_apk"
          fi

      - name: 保留混淆映射
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/mapping/release/mapping.txt
          archive: false
          if-no-files-found: ignore
          retention-days: 14
