name: Android 构建

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 APK 与检查
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: 构建与静态检查
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:lintDebug :app:assembleRelease

      - name: 使用 Secrets 签名 Release APK（可选）
        id: sign_release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::notice::缺少签名 Secrets：${missing[*]}，将上传未签名 Release APK。"
            exit 0
          fi

          umask 077
          keystore_path="$(mktemp "$RUNNER_TEMP/WakeUpLite-signing-XXXXXX")"
          trap 'rm -f -- "$keystore_path"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"

          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          signed_apk="app/build/outputs/apk/release/app-release.apk"
          "$apksigner" sign \
            --ks "$keystore_path" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$signed_apk" \
            "app/build/outputs/apk/release/app-release-unsigned.apk"
          "$apksigner" verify "$signed_apk"
          echo "apk_path=$signed_apk" >> "$GITHUB_OUTPUT"

      # Debug 可直接安装；Release 优先上传已验证的签名包，未配置签名或 PR 构建时上传未签名包。
      - name: 直接上传 Debug APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: 直接上传 Release APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.sign_release.outputs.apk_path || 'app/build/outputs/apk/release/app-release-unsigned.apk' }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: 直接上传 Lint 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: app/build/reports/lint-results-debug.html
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: 直接上传混淆映射
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/mapping/release/mapping.txt
          archive: false
          if-no-files-found: ignore
          retention-days: 14
